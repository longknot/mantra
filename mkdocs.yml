site_name: Mantra Manual
site_description: User manual for the Mantra experimental language and runtime.
repo_name: mantra
docs_dir: manual
repo_url: https://github.com/longknot/mantra

theme:
  name: material
  logo: assets/mantra-nested-scopes-2.svg
  palette:
    - scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/toggle-switch-off-outline
        name: switch to dark mode
    - scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/toggle-switch
        name: switch to light mode
  icon:
    repo: fontawesome/brands/github

